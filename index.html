<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Low Poly Racer</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #9fd3ff; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; color: #fff; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
  #fx { position: fixed; inset: 0; pointer-events: none; }
  #big { top: 26%; left: 0; right: 0; text-align: center; font-size: clamp(60px, 16vw, 160px); line-height: 1; }
  #posInfo { color: #ffd37a; }
  .tr { padding: 8px 12px; background: #3b4a63; }
  .tr.on { background: #ff5a3c; }
  .sw { width: 30px; height: 30px; padding: 0; border-radius: 50%; border: 3px solid transparent; }
  .sw.on { border-color: #fff; }
  #name { text-transform: none; letter-spacing: 0; width: 190px; }
  #startBtn { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); display: none; font-size: 18px; }
  #results { position: fixed; top: 14%; left: 50%; transform: translateX(-50%); display: none; min-width: 260px; max-width: 90vw; background: rgba(20,30,50,.85); border-radius: 14px; padding: 16px 20px; text-align: center; }
  #results h2 { margin: 0 0 10px; }
  .rr { display: flex; justify-content: space-between; gap: 24px; padding: 3px 0; }
  .rr.me { color: #ffd37a; font-weight: 700; }
  .hud { position: fixed; pointer-events: none; text-shadow: 0 2px 6px rgba(0,0,0,.6); font-weight: 700; }
  #hudLeft { top: 14px; left: 16px; font-size: 18px; line-height: 1.5; }
  #hudLeft .big { font-size: 40px; }
  #hudRight { top: 14px; right: 16px; text-align: right; font-size: 15px; line-height: 1.5; pointer-events: auto; }
  #mini { position: fixed; top: 128px; left: 16px; width: 150px; height: 150px; background: rgba(0,0,0,.35); border-radius: 12px; pointer-events: none; }
  #roomBtn { cursor: pointer; background: rgba(0,0,0,.35); padding: 6px 10px; border-radius: 8px; display: none; }
  #toast { bottom: 90px; left: 0; right: 0; text-align: center; font-size: 16px; }
  #menu { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: rgba(20,30,50,.72); text-align: center; padding: 20px; }
  #menu h1 { margin: 0; font-size: clamp(32px, 8vw, 64px); letter-spacing: 3px; }
  #menu p { margin: 0; max-width: 460px; opacity: .85; }
  #menu small { opacity: .7; }
  button, input { font: inherit; border-radius: 10px; border: 0; padding: 12px 20px; }
  button { background: #ff5a3c; color: #fff; font-weight: 700; cursor: pointer; }
  button:hover { background: #ff7a5e; }
  button:disabled { opacity: .5; cursor: default; }
  input { text-transform: uppercase; text-align: center; width: 150px; letter-spacing: 3px; font-weight: 700; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  #status { min-height: 22px; color: #ffd37a; }
  .touch { position: fixed; bottom: 16px; left: 0; right: 0; justify-content: space-between; padding: 0 16px; display: none; pointer-events: none; }
  .touch .grp { display: flex; gap: 12px; pointer-events: auto; }
  .touch button { width: 78px; height: 78px; font-size: 26px; padding: 0; opacity: .8; user-select: none; -webkit-user-select: none; touch-action: none; }
  @media (pointer: coarse) { .touch { display: flex; } }
</style>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="fx"></canvas>

<div class="hud" id="hudLeft">
  <div><span class="big" id="speed">0</span> km/h</div>
  <div id="lapInfo">Lap 1</div>
  <div id="posInfo"></div>
  <div id="timeInfo">Last: -- &nbsp; Best: --</div>
</div>
<canvas id="mini" width="160" height="160"></canvas>
<div class="hud" id="hudRight">
  <div id="players">Solo</div>
  <div id="roomBtn" title="Click to copy invite link"></div>
  <button id="menuBtn" style="padding:6px 12px;margin-top:6px;font-size:14px">Menu (Esc)</button>
</div>
<div class="hud" id="toast"></div>
<div class="hud" id="big"></div>
<button id="startBtn">Start race</button>
<div id="results">
  <h2 id="resTitle"></h2>
  <div id="resList"></div>
  <button id="again" style="margin-top:10px">Race again</button>
</div>

<div class="touch">
  <div class="grp"><button id="tLeft">◀</button><button id="tRight">▶</button></div>
  <div class="grp"><button id="tBrake">■</button><button id="tGas">▲</button></div>
</div>

<div id="menu">
  <h1>LOW POLY RACER</h1>
  <p>Race friends right in your browser. Cars pass through each other, so nobody gets wrecked.</p>
  <div class="row" id="tracks"></div>
  <input id="name" maxlength="12" placeholder="Your name" autocomplete="off">
  <div class="row" id="swatches"></div>
  <button id="solo">Drive solo (3 laps)</button>
  <button id="host">Host a race</button>
  <div class="row">
    <input id="code" maxlength="5" placeholder="CODE" autocomplete="off">
    <button id="join">Join</button>
  </div>
  <div id="status"></div>
  <small>W / ↑ gas &nbsp;·&nbsp; S / ↓ brake &nbsp;·&nbsp; A D / ← → steer &nbsp;·&nbsp; Space handbrake (drift) &nbsp;·&nbsp; R reset to track &nbsp;·&nbsp; M mute</small>
</div>

<script type="module">
import * as THREE from 'three';

/* ---------- renderer / scene ---------- */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9fd3ff);
scene.fog = new THREE.Fog(0x9fd3ff, 220, 1150);
const camera = new THREE.PerspectiveCamera(70, 1, 0.1, 2000);

function resize() {
  renderer.setSize(window.innerWidth, window.innerHeight, false);
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

scene.add(new THREE.HemisphereLight(0xffffff, 0x4a7a3a, 1.4));
const sun = new THREE.DirectionalLight(0xfff2cc, 2.2);
sun.position.set(100, 200, 50);
scene.add(sun);

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(2400, 2400),
  new THREE.MeshStandardMaterial({ color: 0x5a9e4b, flatShading: true })
);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

/* ---------- track ---------- */
const ROAD_W = 10;          // half width of the road
const KERB_W = 1.2;
const WALL_D = ROAD_W + KERB_W + 3.5;   // distance from the centre line to the barriers
// A proper circuit (about 1.5 km): start straight, fast right, chicane, back straight,
// hairpin, left kink, long sweeper and a final corner back onto the straight.
const TRACKS = [
  { name: 'Grand Circuit', ground: 0x5a9e4b, sky: 0x9fd3ff, pts: [
  [-60, 0], [60, 0], [170, -2],                                          // start / finish straight
  [225, 12], [262, 50], [272, 100],                                      // fast right-hander
  [284, 145], [268, 185], [270, 230],                                    // chicane
  [262, 265], [235, 288], [190, 297],                                    // right onto the back straight
  [80, 297], [-40, 297],                                                 // back straight
  [-120, 297], [-145, 286], [-156, 261], [-145, 236], [-120, 225],       // hairpin
  [-70, 225], [-30, 212], [-5, 185],                                     // left kink
  [-10, 150], [-45, 125], [-95, 105],                                    // long right-hand sweeper
  [-135, 80], [-145, 45], [-125, 15], [-90, 2]                           // final corner
] },
  { name: 'Mountain Loop', ground: 0x8c7b47, sky: 0xe8c9a0, pts: [   // tight and twisty, about 1.1 km
    [-60, 0, 0], [50, 0, 0], [140, 2, 2], [205, -20, 6], [240, -70, 11], [235, -125, 15], [200, -165, 17], [150, -175, 15],
    [110, -150, 10], [85, -110, 5], [40, -95, 2], [-5, -115, 4], [-45, -160, 8], [-100, -175, 9], [-150, -150, 6],
    [-175, -100, 3], [-165, -50, 1], [-120, -15, 0]] },   // [x, z, height]
  { name: 'Coastal Sprint', ground: 0xc9b97a, sky: 0x8fd0ff, pts: [   // fast and flowing, about 1.4 km
    [-100, 0, 0], [20, 0, 0], [140, 0, 1], [250, -5, 3], [320, 25, 5], [350, 85, 6], [340, 150, 4], [300, 195, 2],
    [240, 215, 0], [185, 200, 0], [150, 160, 2], [120, 115, 5], [75, 100, 7], [20, 115, 6], [-30, 150, 3],
    [-85, 165, 1], [-150, 150, 0], [-185, 105, 0], [-190, 45, 0], [-160, 10, 0]] },
  { name: 'Skyway', ground: 0x7a8a7a, sky: 0xb8d8f0, pts: [   // figure of eight: climb up and over a bridge, then pass under it
    [-60, 0, 0], [60, 0, 0], [120, 0, 0], [190, 0, 0], [245, 25, 0], [270, 80, 1], [255, 140, 3], [205, 185, 6],
    [140, 195, 9], [75, 185, 11.5], [25, 160, 12], [0, 120, 12], [0, 70, 12], [0, 35, 12], [0, 0, 12], [0, -35, 12],
    [0, -70, 12], [0, -120, 10], [-30, -170, 6], [-90, -195, 2.5], [-160, -175, 0], [-195, -120, 0], [-190, -60, 0],
    [-160, -20, 0], [-120, 0, 0]] }
];
const TRACK_ID = (() => { const t = parseInt(new URLSearchParams(location.search).get('track'), 10); return t >= 0 && t < TRACKS.length ? t : 0; })();
const TRACK_LETTERS = 'ABCDEFGH'.slice(0, TRACKS.length);   // first letter of a room code says which track it uses
ground.material.color.setHex(TRACKS[TRACK_ID].ground);
scene.background.setHex(TRACKS[TRACK_ID].sky); scene.fog.color.setHex(TRACKS[TRACK_ID].sky);
const controlPts = TRACKS[TRACK_ID].pts.map(([x, z, y = 0]) => new THREE.Vector3(x, y, z));
const curve = new THREE.CatmullRomCurve3(controlPts, true, 'centripetal');
const N = 800;
const SPAWN_IDX = N - 10;
const center = curve.getSpacedPoints(N).slice(0, N);
const tang = center.map((p, i) =>
  center[(i + 1) % N].clone().sub(center[(i - 1 + N) % N]).setY(0).normalize());

(function buildRoad() {
  const pos = [], col = [];
  const road1 = new THREE.Color(0x3a3a42), road2 = new THREE.Color(0x44444d);
  const red = new THREE.Color(0xd8342c), white = new THREE.Color(0xf2f2f2);

  function tri(a, b, c, color, y) {
    for (const v of [a, b, c]) { pos.push(v[0], y + v[2], v[1]); col.push(color.r, color.g, color.b); }
  }
  function quad(a, b, c, d, color, y) { tri(a, b, c, color, y); tri(a, c, d, color, y); }
  function side(i, s, w) {
    const p = center[i % N], t = tang[i % N];
    return [p.x + (-t.z) * s * w, p.z + t.x * s * w, p.y];
  }

  for (let i = 0; i < N; i++) {
    const R0 = side(i, 1, ROAD_W), L0 = side(i, -1, ROAD_W);
    const R1 = side(i + 1, 1, ROAD_W), L1 = side(i + 1, -1, ROAD_W);
    quad(R0, R1, L1, L0, Math.floor(i / 3) % 2 ? road1 : road2, 0.05);
    if (Math.floor(i / 4) % 2 === 0) {            // dashed centre line
      quad(side(i, 1, 0.3), side(i + 1, 1, 0.3), side(i + 1, -1, 0.3), side(i, -1, 0.3), white, 0.07);
    }

    const kc = Math.floor(i / 2) % 2 ? red : white;
    for (const s of [1, -1]) {
      const in0 = side(i, s, ROAD_W), out0 = side(i, s, ROAD_W + KERB_W);
      const in1 = side(i + 1, s, ROAD_W), out1 = side(i + 1, s, ROAD_W + KERB_W);
      quad(in0, out0, out1, in1, kc, 0.08);
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  geo.computeVertexNormals();
  scene.add(new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
    vertexColors: true, flatShading: true, side: THREE.DoubleSide
  })));

  // start / finish line
  const cv = document.createElement('canvas'); cv.width = 16; cv.height = 2;
  const cx = cv.getContext('2d');
  for (let x = 0; x < 16; x++) for (let y = 0; y < 2; y++) {
    cx.fillStyle = (x + y) % 2 ? '#111' : '#fff'; cx.fillRect(x, y, 1, 1);
  }
  const tex = new THREE.CanvasTexture(cv);
  tex.magFilter = THREE.NearestFilter; tex.minFilter = THREE.NearestFilter;
  const lineGeo = new THREE.PlaneGeometry(ROAD_W * 2, 3);
  lineGeo.rotateX(-Math.PI / 2);
  const line = new THREE.Mesh(lineGeo, new THREE.MeshBasicMaterial({ map: tex }));
  line.position.set(center[0].x, center[0].y + 0.1, center[0].z);
  line.rotation.y = Math.atan2(tang[0].x, tang[0].z);
  scene.add(line);
})();

/* trees (seeded so every player sees the same ones) */
(function buildTrees() {
  let seed = 1234;
  const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const spots = [];
  for (let k = 0; k < 1500 && spots.length < 260; k++) {
    const x = -420 + rnd() * 940, z = -200 + rnd() * 740;
    if (x > -20 && x < 130 && z > -100 && z < -10) continue;   // keep the grandstand area clear
    let min = 1e9;
    for (let i = 0; i < N; i += 2) {
      const dx = center[i].x - x, dz = center[i].z - z;
      const d = dx * dx + dz * dz; if (d < min) min = d;
    }
    if (Math.sqrt(min) > WALL_D + 10) spots.push([x, z, 0.8 + rnd() * 0.9]);
  }
  const trunks = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.4, 0.55, 2, 5),
    new THREE.MeshStandardMaterial({ color: 0x6b4a2b, flatShading: true }), spots.length);
  const tops = new THREE.InstancedMesh(new THREE.ConeGeometry(2.6, 7, 5),
    new THREE.MeshStandardMaterial({ color: 0x2f7a3a, flatShading: true }), spots.length);
  const m = new THREE.Matrix4();
  spots.forEach(([x, z, s], i) => {
    m.makeScale(s, s, s).setPosition(x, 1 * s, z); trunks.setMatrixAt(i, m);
    m.makeScale(s, s, s).setPosition(x, 5.5 * s, z); tops.setMatrixAt(i, m);
  });
  scene.add(trunks, tops);
})();

/* barriers along both sides of the circuit */
(function buildWalls() {
  const pos = [], col = [];
  const red = new THREE.Color(0xd8342c), white = new THREE.Color(0xf2f2f2);
  const H = 1.4, T = 0.8;
  function at(i, s, w, y) {
    const p = center[i % N], t = tang[i % N];
    return [p.x + (-t.z) * s * w, y + p.y, p.z + t.x * s * w];
  }
  function quad(a, b, c, d, color) {
    for (const v of [a, b, c, a, c, d]) { pos.push(v[0], v[1], v[2]); col.push(color.r, color.g, color.b); }
  }
  for (let i = 0; i < N; i++) {
    const c = Math.floor(i / 4) % 2 ? red : white;
    for (const s of [1, -1]) {
      quad(at(i, s, WALL_D, 0), at(i + 1, s, WALL_D, 0), at(i + 1, s, WALL_D, H), at(i, s, WALL_D, H), c);          // face
      quad(at(i, s, WALL_D, H), at(i + 1, s, WALL_D, H), at(i + 1, s, WALL_D + T, H), at(i, s, WALL_D + T, H), c);  // top
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  geo.computeVertexNormals();
  scene.add(new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
    vertexColors: true, flatShading: true, side: THREE.DoubleSide
  })));
})();

/* raised sections get a concrete deck underneath and pillars (skipped where another road passes below) */
(function buildBridges() {
  const pos = [], col = [];
  const conc = new THREE.Color(0x8f939c), under = new THREE.Color(0x6f737c);
  const W2 = ROAD_W + KERB_W;
  const at = (i, s, y) => { const p = center[i % N], t = tang[i % N]; return [p.x + (-t.z) * s * W2, p.y + y, p.z + t.x * s * W2]; };
  const quad = (a, b, c, d, color) => { for (const v of [a, b, c, a, c, d]) { pos.push(v[0], v[1], v[2]); col.push(color.r, color.g, color.b); } };
  for (let i = 0; i < N; i++) {
    if (Math.min(center[i].y, center[(i + 1) % N].y) < 1.0) continue;
    quad(at(i, 1, -0.9), at(i + 1, 1, -0.9), at(i + 1, -1, -0.9), at(i, -1, -0.9), under);
    for (const s of [1, -1]) quad(at(i, s, 0.05), at(i + 1, s, 0.05), at(i + 1, s, -0.9), at(i, s, -0.9), conc);
  }
  if (pos.length) {
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
    geo.computeVertexNormals();
    scene.add(new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, side: THREE.DoubleSide })));
  }
  const pm = new THREE.MeshStandardMaterial({ color: 0x9aa0aa, flatShading: true });
  for (let i = 0; i < N; i += 10) {
    const c = center[i];
    if (c.y < 3) continue;
    let blocked = false;
    for (let j = 0; j < N; j += 2) {
      const o = center[j];
      if (o.y < c.y - 5 && Math.hypot(o.x - c.x, o.z - c.z) < WALL_D + 8) { blocked = true; break; }
    }
    if (blocked) continue;
    const h = c.y - 0.9;
    const pil = new THREE.Mesh(new THREE.BoxGeometry(5, h, 2.4), pm);
    pil.position.set(c.x, h / 2, c.z);
    pil.rotation.y = Math.atan2(tang[i].x, tang[i].z);
    scene.add(pil);
  }
})();

/* start gantry and grandstand */
(function buildStart() {
  const mat = c => new THREE.MeshStandardMaterial({ color: c, flatShading: true });

  const gantry = new THREE.Group();
  const w = ROAD_W + 2;
  for (const s of [-1, 1]) {
    const post = new THREE.Mesh(new THREE.BoxGeometry(1, 10, 1), mat(0x30343c));
    post.position.set(s * w, 5, 0); gantry.add(post);
  }
  const beam = new THREE.Mesh(new THREE.BoxGeometry(w * 2 + 1, 1.8, 1.4), mat(0xd8342c));
  beam.position.set(0, 10, 0); gantry.add(beam);
  const stripe = new THREE.Mesh(new THREE.BoxGeometry(w * 2 - 4, 0.6, 1.5), new THREE.MeshBasicMaterial({ color: 0xffffff }));
  stripe.position.set(0, 10, 0); gantry.add(stripe);
  gantry.position.set(center[0].x, center[0].y, center[0].z);
  gantry.rotation.y = Math.atan2(tang[0].x, tang[0].z);
  scene.add(gantry);

  // grandstand on the outside of the start straight
  const si = Math.round(N * 0.07), sp = center[si], st = tang[si];
  const stand = new THREE.Group();
  const LEN = 110;
  for (let k = 0; k < 4; k++) {
    const h = 2.2 * (k + 1);
    const tier = new THREE.Mesh(new THREE.BoxGeometry(3.2, h, LEN), mat(0x8a909a));
    tier.position.set(k * 3.2 + 1.6, h / 2, 0); stand.add(tier);
  }
  const crowd = new THREE.InstancedMesh(new THREE.BoxGeometry(1.1, 1.1, 1.1), mat(0xffffff), 4 * 50);
  const m = new THREE.Matrix4(), c = new THREE.Color();
  let n = 0;
  for (let k = 0; k < 4; k++) for (let j = 0; j < 50; j++) {
    m.makeTranslation(k * 3.2 + 1.6, 2.2 * (k + 1) + 0.55, -LEN / 2 + 1 + j * (LEN - 2) / 49);
    crowd.setMatrixAt(n, m);
    c.setHSL((n * 0.618) % 1, 0.7, 0.55); crowd.setColorAt(n, c); n++;
  }
  stand.add(crowd);
  const roof = new THREE.Mesh(new THREE.BoxGeometry(14, 0.5, LEN + 4), mat(0xd8342c));
  roof.position.set(7, 14.5, 0); stand.add(roof);
  for (const z of [-LEN / 2, 0, LEN / 2]) {
    const post = new THREE.Mesh(new THREE.BoxGeometry(0.6, 14, 0.6), mat(0x30343c));
    post.position.set(13.3, 7, z); stand.add(post);
  }
  stand.position.set(sp.x + st.z * (WALL_D + 8), sp.y, sp.z - st.x * (WALL_D + 8));
  stand.rotation.y = Math.atan2(st.x, st.z);
  scene.add(stand);
})();

/* distant hills */
(function buildHills() {
  let seed = 99;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const mats = [0x6f8f6a, 0x7d9a8c, 0x8a9aa8].map(c => new THREE.MeshStandardMaterial({ color: c, flatShading: true }));
  for (let k = 0; k < 36; k++) {
    const a = k / 36 * Math.PI * 2 + rnd() * 0.1, r = 720 + rnd() * 120;
    const h = 80 + rnd() * 140, rad = 90 + rnd() * 90;
    const hill = new THREE.Mesh(new THREE.ConeGeometry(rad, h, 5), mats[Math.floor(rnd() * 3)]);
    hill.position.set(60 + Math.cos(a) * r, h / 2 - 2, 150 + Math.sin(a) * r);
    hill.rotation.y = rnd() * 6;
    scene.add(hill);
  }
})();

function nearest(x, z, y) {          // y (optional): prefer the road at the car's height
  let best = 1e18, bi = 0, flatBest = 0;
  for (let i = 0; i < N; i++) {
    const dx = center[i].x - x, dz = center[i].z - z;
    const flat = dx * dx + dz * dz;
    let d = flat;
    if (y !== undefined) { const dy = (center[i].y - y) * 2.5; d += dy * dy; }
    if (d < best) { best = d; bi = i; flatBest = flat; }
  }
  return { i: bi, d: Math.sqrt(flatBest) };
}

/* ---------- cars ---------- */
// builds a low poly body by lofting between cross-sections (flat shaded, so it looks faceted)
function loft(secs, color) {
  const pts = secs.map(sc => {
    const wt = sc.wt ?? sc.w;
    return [[-sc.w, sc.y0], [sc.w, sc.y0], [wt, sc.y1], [-wt, sc.y1]]
      .map(([x, y]) => new THREE.Vector3(x, y, sc.z));
  });
  const tris = [];
  const quad = (p, q, r, t) => { tris.push([p, q, r], [p, r, t]); };
  for (let i = 0; i < pts.length - 1; i++) {
    const A = pts[i], B = pts[i + 1];
    for (let k = 0; k < 4; k++) { const k2 = (k + 1) % 4; quad(A[k], A[k2], B[k2], B[k]); }
  }
  const f = pts[0], l = pts[pts.length - 1];
  quad(f[0], f[1], f[2], f[3]);
  quad(l[0], l[1], l[2], l[3]);
  const cen = new THREE.Vector3(); let n = 0;
  for (const row of pts) for (const v of row) { cen.add(v); n++; }
  cen.divideScalar(n);
  const pos = [];
  for (const t of tris) {
    let [p, q, r] = t;
    const nrm = new THREE.Vector3().subVectors(q, p).cross(new THREE.Vector3().subVectors(r, p));
    const mid = new THREE.Vector3().add(p).add(q).add(r).divideScalar(3).sub(cen);
    if (nrm.dot(mid) < 0) { const tmp = q; q = r; r = tmp; }   // make every face point outwards
    pos.push(p.x, p.y, p.z, q.x, q.y, q.z, r.x, r.y, r.z);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.computeVertexNormals();
  return new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color, flatShading: true }));
}

function makeCar(hue) {
  const g = new THREE.Group();
  const tilt = new THREE.Group();          // body + wheels lean together
  g.add(tilt);
  const mat = (c, o = {}) => new THREE.MeshStandardMaterial({ color: c, flatShading: true, ...o });
  const paint = new THREE.Color().setHSL(hue, 0.85, 0.5);
  const trim = new THREE.Color().setHSL(hue, 0.5, 0.92);
  const dark = 0x1a1d24;
  const box = (w, h, d, x, y, z, c, o) => {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat(c, o));
    m.position.set(x, y, z); tilt.add(m); return m;
  };

  // low wedge body: blunt tail, wide side pods, long sloping nose
  tilt.add(loft([
    { z: -2.3, w: 0.8,  y0: 0.38, y1: 0.95, wt: 0.68 },
    { z: -1.4, w: 1.05, y0: 0.32, y1: 1.0,  wt: 0.82 },
    { z: -0.3, w: 1.1,  y0: 0.3,  y1: 0.92, wt: 0.88 },
    { z: 0.9,  w: 1.0,  y0: 0.3,  y1: 0.7,  wt: 0.8 },
    { z: 2.3,  w: 0.72, y0: 0.32, y1: 0.46, wt: 0.5 }
  ], paint));
  // canopy
  tilt.add(loft([
    { z: -1.0, w: 0.56, y0: 0.94, y1: 1.12, wt: 0.46 },
    { z: -0.3, w: 0.6,  y0: 0.9,  y1: 1.4,  wt: 0.36 },
    { z: 0.55, w: 0.62, y0: 0.78, y1: 1.1,  wt: 0.5 }
  ], 0x141c28));
  // splitter and side skirts
  box(1.75, 0.06, 0.55, 0, 0.32, 2.3, dark);
  for (const sx of [-1, 1]) box(0.1, 0.12, 2.4, sx * 1.1, 0.38, -0.2, dark);
  // rear wing: posts, plank, end plates
  for (const sx of [-1, 1]) {
    box(0.08, 0.42, 0.1, sx * 0.45, 1.12, -2.1, dark);
    box(0.07, 0.48, 0.85, sx * 1.07, 1.42, -2.2, paint);
  }
  box(2.2, 0.07, 0.7, 0, 1.42, -2.2, trim);
  // lights
  for (const sx of [-1, 1]) box(0.34, 0.11, 0.06, sx * 0.4, 0.42, 2.33, 0xfff2b0, { emissive: 0xfff2b0 });
  box(1.2, 0.12, 0.06, 0, 0.82, -2.33, 0xff2a2a, { emissive: 0xff2a2a });

  // wheels: front ones sit in pivots so they can steer
  const wheels = [], fw = [];
  const wheel = (r, w, x, z, steer) => {
    const geo = new THREE.CylinderGeometry(r, r, w, 10); geo.rotateZ(Math.PI / 2);
    const m = new THREE.Mesh(geo, mat(0x15171c));
    const hubGeo = new THREE.CylinderGeometry(r * 0.55, r * 0.55, w + 0.04, 6); hubGeo.rotateZ(Math.PI / 2);
    m.add(new THREE.Mesh(hubGeo, mat(0xb9c0cc)));
    const pivot = new THREE.Group();
    pivot.position.set(x, r, z);
    pivot.add(m); tilt.add(pivot);
    wheels.push(m);
    if (steer) fw.push(pivot);
  };
  wheel(0.5, 0.5, -1.17, 1.45, true);  wheel(0.5, 0.5, 1.17, 1.45, true);
  wheel(0.54, 0.72, -1.2, -1.35, false); wheel(0.54, 0.72, 1.2, -1.35, false);

  g.rotation.order = 'YXZ';             // yaw first, then pitch with the slope
  g.userData = { tilt, wheels, fw, roll: 0, pitch: 0 };
  return g;
}

// leans the body, steers and spins the wheels
function animateCar(car, dt, steer, vf, braking, accel) {
  const u = car.userData;
  const sf = Math.min(1, Math.abs(vf) / VMAX);
  u.roll += (steer * Math.min(1, sf * 1.6) * 0.07 - u.roll) * Math.min(1, 8 * dt);
  u.pitch += ((braking ? 0.045 : 0) - (accel ? 0.022 : 0) - u.pitch) * Math.min(1, 6 * dt);
  u.tilt.rotation.z = u.roll;
  u.tilt.rotation.x = u.pitch;
  for (const p of u.fw) p.rotation.y = steer * 0.45;
  for (const w of u.wheels) w.rotation.x += vf * dt / 0.5;
}

const VMAX = 92;                      // top speed (world units per second)
const HUES = [0.0, 0.07, 0.14, 0.33, 0.5, 0.6, 0.75, 0.9];
let prefs = {};
try { prefs = JSON.parse(localStorage.getItem('lpr') || '{}') || {}; } catch (e) { prefs = {}; }
function savePrefs() { try { localStorage.setItem('lpr', JSON.stringify({ name: me.name, hue: me.hue })); } catch (e) {} }
const me = { x: 0, y: 0, z: 0, th: 0, pit: 0, speed: 0, spd: 0, slip: 0, prog: 0, vx: 0, vz: 0, steer: 0,
  hue: typeof prefs.hue === 'number' ? prefs.hue : HUES[Math.floor(Math.random() * HUES.length)],
  name: String(prefs.name || ('Player' + Math.floor(Math.random() * 90 + 10))).slice(0, 12) };
let myCar = makeCar(me.hue);
scene.add(myCar);

function spawn() {
  const i = SPAWN_IDX;
  const p = center[i], t = tang[i];
  const off = (Math.random() - 0.5) * 12;
  me.x = p.x + (-t.z) * off; me.z = p.z + t.x * off; me.y = p.y;
  me.th = Math.atan2(t.x, t.z); me.speed = 0; me.vx = 0; me.vz = 0; me.steer = 0;
}
function resetCar() {
  const n = nearest(me.x, me.z, me.y), t = tang[n.i];
  me.x = center[n.i].x; me.z = center[n.i].z; me.y = center[n.i].y;
  me.th = Math.atan2(t.x, t.z); me.speed = 0; me.vx = 0; me.vz = 0; me.steer = 0;
}
spawn();

/* ---------- input ---------- */
const keys = {}, touch = {};
window.addEventListener('keydown', e => {

/* ---------- skid marks ---------- */
const MARKS = 900;
const markMesh = new THREE.InstancedMesh(
  new THREE.PlaneGeometry(0.45, 1.3),
  new THREE.MeshBasicMaterial({ color: 0x0c0c0e, transparent: true, opacity: 0.5, depthWrite: false }),
  MARKS);
markMesh.frustumCulled = false;
const markDummy = new THREE.Object3D();
markDummy.rotation.order = 'YXZ';
markDummy.scale.set(0, 0, 0);
for (let i = 0; i < MARKS; i++) { markDummy.updateMatrix(); markMesh.setMatrixAt(i, markDummy.matrix); }
markDummy.scale.set(1, 1, 1);
scene.add(markMesh);
let markI = 0, lastMX = 1e9, lastMZ = 1e9;
function addMarks(fx, fz, lx, lz, yaw) {
  if (Math.hypot(me.x - lastMX, me.z - lastMZ) < 1.0) return;
  lastMX = me.x; lastMZ = me.z;
  for (const sx of [-1, 1]) {
    markDummy.position.set(me.x - fx * 1.35 + lx * 1.2 * sx, me.y + 0.12, me.z - fz * 1.35 + lz * 1.2 * sx);
    markDummy.rotation.set(-Math.PI / 2, yaw, 0);
    markDummy.updateMatrix();
    markMesh.setMatrixAt(markI, markDummy.matrix);
    markI = (markI + 1) % MARKS;
  }
  markMesh.instanceMatrix.needsUpdate = true;
}

/* ---------- sound (all synthesised, no files) ---------- */
let AC = null, eng = null, scr = null, muted = false;
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    const master = AC.createGain(); master.gain.value = 0.5; master.connect(AC.destination);
    AC.out = master;
    const o1 = AC.createOscillator(); o1.type = 'sawtooth';
    const o2 = AC.createOscillator(); o2.type = 'square';
    const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 700;
    const g = AC.createGain(); g.gain.value = 0;
    o1.connect(lp); o2.connect(lp); lp.connect(g); g.connect(master); o1.start(); o2.start();
    eng = { o1, o2, lp, g };
    const n = AC.sampleRate, buf = AC.createBuffer(1, n, n), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    const src = AC.createBufferSource(); src.buffer = buf; src.loop = true;
    const bp = AC.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1800; bp.Q.value = 0.8;
    const sg = AC.createGain(); sg.gain.value = 0;
    src.connect(bp); bp.connect(sg); sg.connect(master); src.start();
    scr = { g: sg, bp };
  } catch (e) { AC = null; eng = null; scr = null; }
}
function beep(freq, dur = 0.18) {
  if (!AC || muted) return;
  try {
    const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
    o.type = 'square'; o.frequency.value = freq;
    g.gain.setValueAtTime(0.25, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(AC.out); o.start(t); o.stop(t + dur);
  } catch (e) {}
}
// engine pitch climbs through 5 "gears" so you hear the speed building; tyres squeal when sliding
function soundTick(thr, slip, brk) {
  if (!AC || !eng) return;
  const t = AC.currentTime, sf = Math.min(1, me.spd / VMAX);
  const gear = Math.min(4, Math.floor(sf * 5)), frac = Math.min(1, sf * 5 - gear);
  const rpm = (thr ? 0.25 : 0.12) + (thr ? 0.75 : 0.5) * frac;
  const freq = 46 + 150 * rpm + gear * 14;
  eng.o1.frequency.setTargetAtTime(freq, t, 0.05);
  eng.o2.frequency.setTargetAtTime(freq * 0.5, t, 0.05);
  eng.lp.frequency.setTargetAtTime(450 + rpm * 1500, t, 0.05);
  eng.g.gain.setTargetAtTime(muted ? 0 : (0.04 + 0.06 * (0.4 + 0.6 * sf)) * (thr ? 1 : 0.55), t, 0.08);
  const slide = Math.max(0, Math.min(1, (Math.abs(slip) - 3) / 12)) + (brk && me.spd > 25 ? 0.4 : 0);
  scr.g.gain.setTargetAtTime(muted ? 0 : 0.16 * Math.min(1, slide), t, 0.05);
  scr.bp.frequency.setTargetAtTime(1400 + 800 * sf, t, 0.1);
}
window.addEventListener('keydown', e => {
  if (e.target && e.target.tagName === 'INPUT') return;
  initAudio();
  if (e.code === 'KeyM') { muted = !muted; toast(muted ? 'Sound off' : 'Sound on', 1200); }
  if (e.code === 'Escape' && started) toMenu();
});
// back to the main menu: reloads the page on the same track (this also leaves any multiplayer room)
function toMenu() {
  if (net.peer && !window.confirm('Leave this race and go back to the menu?')) return;
  location.href = location.pathname + '?track=' + TRACK_ID;
}

/* ---------- driving + laps ---------- */
let lapsDone = 0, half = false, lastIdx = SPAWN_IDX, lapStart = performance.now();
let touchingWall = false;
let lastLap = null, bestLap = null;
let started = false;
const fmt = t => t == null ? '--' : t.toFixed(2) + 's';

function update(dt) {
  raceTick();
  const frozen = race.state === 'countdown';          // can't drive until GO
  const up = !frozen && (keys.ArrowUp || keys.KeyW || touch.gas);
  const down = !frozen && (keys.ArrowDown || keys.KeyS || touch.brake);
  const left = !frozen && (keys.ArrowLeft || keys.KeyA || touch.left);
  const right = !frozen && (keys.ArrowRight || keys.KeyD || touch.right);
  const hand = !frozen && keys.Space;

  const near = nearest(me.x, me.z, me.y);
  const off = near.d > ROAD_W + KERB_W;
  me.y += (center[near.i].y - me.y) * Math.min(1, 14 * dt);          // stick to the road surface
  const iA = (near.i + 8) % N, iB = (near.i - 8 + N) % N;
  const run = Math.hypot(center[iA].x - center[iB].x, center[iA].z - center[iB].z) || 1;
  const slope = (center[iA].y - center[iB].y) / run;                   // > 0 means climbing in the track direction
  const slopeAlong = slope * (Math.sin(me.th) * tang[near.i].x + Math.cos(me.th) * tang[near.i].z);
  const cap = off ? VMAX * 0.42 : VMAX;

  // steering eases in and out instead of snapping
  const steerIn = (left ? 1 : 0) - (right ? 1 : 0);
  me.steer += (steerIn - me.steer) * Math.min(1, (steerIn ? 7 : 11) * dt);

  // split the velocity into "along the car" (vf) and "sideways" (vl)
  const fx = Math.sin(me.th), fz = Math.cos(me.th);
  const lx = Math.cos(me.th), lz = -Math.sin(me.th);
  let vf = me.vx * fx + me.vz * fz;
  let vl = me.vx * lx + me.vz * lz;

  // engine: strong off the line, tapers off as it nears top speed
  const spd0 = Math.hypot(vf, vl);
  const braking = !!down && spd0 > 6 && vf > -3;
  if (down) {
    if (vf > 0) {                                   // brakes act against the way the car is actually moving,
      const k = Math.max(0, 1 - 50 * dt / Math.max(spd0, 0.01));   // so a slide keeps its angle while it slows
      vf *= k; vl *= k;
    } else vf -= 22 * dt;                           // already stopped: reverse
  } else if (up) vf += 38 * Math.max(0, 1 - Math.pow(Math.max(vf, 0) / VMAX, 1.4)) * dt;
  else vf -= Math.sign(vf) * Math.min(Math.abs(vf), (5 + 0.0012 * vf * vf) * dt);
  if (hand) vf -= Math.sign(vf) * Math.min(Math.abs(vf), 9 * dt);
  vf -= 28 * slopeAlong * dt;                          // uphill slows the car, downhill speeds it up
  vf = Math.max(vf, -18);
  if (vf > cap) vf -= (vf - cap) * Math.min(1, 2.5 * dt);

  // tyre grip: sideways speed bleeds away. Braking and the handbrake loosen it, so the back steps out.
  const spd = Math.hypot(vf, vl);
  let grip = 9;
  if (braking) grip = 3.2 + 2.6 * (1 - Math.min(1, Math.abs(me.steer)));
  if (hand) grip = Math.min(grip, 2.2);
  grip *= 1 - 0.3 * Math.min(1, spd / VMAX) * Math.abs(me.steer);
  if (off) grip *= 0.75;
  vl *= Math.exp(-grip * dt);
  me.slip = vl;

  // turn rate: sharp at low speed, lazy at top speed, and much sharper when braking / handbraking
  const sp = Math.abs(vf);
  let yaw = 2.5 / (1 + (sp / 42) * (sp / 42)) * Math.min(1, sp / 7);
  if (braking) yaw *= 1.4;
  if (hand) yaw *= 1.35;

  // move with the (old-heading) velocity, then turn the car; the gap between the two is the slide
  me.vx = fx * vf + lx * vl;
  me.vz = fz * vf + lz * vl;
  me.x += me.vx * dt;
  me.z += me.vz * dt;
  me.th += me.steer * yaw * (vf >= 0 ? 1 : -1) * dt;
  me.speed = vf;
  me.spd = Math.hypot(me.vx, me.vz);

  // tyre marks when the car is properly sliding
  if (!off && (Math.abs(vl) > 4 || (braking && vf > 25) || (hand && vf > 12))) {
    addMarks(fx, fz, lx, lz, Math.atan2(me.vx, me.vz));
  }

  // barriers: keep the car on the circuit; it slides along the wall and loses speed
  const hit = nearest(me.x, me.z, me.y), lim = WALL_D - 1.3;
  if (hit.d > lim) {
    const c = center[hit.i], dx = me.x - c.x, dz = me.z - c.z, d = Math.hypot(dx, dz) || 1;
    const nx = dx / d, nz = dz / d;
    me.x = c.x + nx * lim; me.z = c.z + nz * lim;
    const vn = me.vx * nx + me.vz * nz;
    if (vn > 0) { me.vx -= nx * vn * 1.1; me.vz -= nz * vn * 1.1; }
    if (!touchingWall) { me.vx *= 0.7; me.vz *= 0.7; }
    const k = Math.max(0, 1 - 2.5 * dt);
    me.vx *= k; me.vz *= k;
    me.speed = me.vx * Math.sin(me.th) + me.vz * Math.cos(me.th);
    me.spd = Math.hypot(me.vx, me.vz);
    touchingWall = true;
  } else touchingWall = false;

  // lap counting
  const idx = near.i;
  me.prog = lapsDone + ((lapsDone === 0 && !half && idx > N * 0.8) ? idx / N - 1 : idx / N);
  if (idx >= N * 0.4 && idx <= N * 0.6) half = true;
  if (lastIdx > N * 0.8 && idx < N * 0.2) {
    if (half) {
      const now = performance.now();
      lastLap = (now - lapStart) / 1000;
      bestLap = bestLap == null ? lastLap : Math.min(bestLap, lastLap);
      lapStart = now; lapsDone++;
      if (race.state === 'racing' && lapsDone >= LAPS) finishRace(now);
    }
    half = false;
  }
  lastIdx = idx;

  myCar.position.set(me.x, me.y, me.z);
  me.pit += (-Math.atan(slopeAlong) - me.pit) * Math.min(1, 10 * dt);
  myCar.rotation.set(me.pit, me.th, 0);
  animateCar(myCar, dt, me.steer, me.speed, braking, !!up && !down);

  document.getElementById('speed').textContent = Math.round(me.spd * 2);
  document.getElementById('lapInfo').textContent = race.state === 'free' ? 'Lap ' + (lapsDone + 1) : 'Lap ' + Math.min(lapsDone + 1, LAPS) + '/' + LAPS;
  soundTick(!!up && !down, me.slip, braking);
  document.getElementById('timeInfo').innerHTML = 'Last: ' + fmt(lastLap) + ' &nbsp; Best: ' + fmt(bestLap);
}

/* ---------- multiplayer (PeerJS, peer-to-peer, star topology around the host) ---------- */
const net = { peer: null, host: false, id: null, conns: {}, states: {}, snapshot: {}, hostConn: null, code: null };
const remotes = {};
const $ = id => document.getElementById(id);
const menu = $('menu'), statusEl = $('status');
const setStatus = msg => { statusEl.textContent = msg; };
function toast(msg, ms = 3000) { $('toast').textContent = msg; setTimeout(() => { if ($('toast').textContent === msg) $('toast').textContent = ''; }, ms); }

function mine() {
  return { x: +me.x.toFixed(2), y: +me.y.toFixed(2), z: +me.z.toFixed(2), r: +me.th.toFixed(3), v: +me.speed.toFixed(1), h: me.hue,
    n: me.name, p: +me.prog.toFixed(3), f: race.finish };
}
function startGame() {
  started = true; menu.style.display = 'none';
  lapStart = performance.now();
}
function showRoom(code) {
  net.code = code;
  const link = location.origin + location.pathname + '?room=' + code;
  const b = $('roomBtn');
  b.style.display = 'block';
  b.textContent = 'Room ' + code + ' (tap to copy link)';
  b.onclick = () => {
    (navigator.clipboard ? navigator.clipboard.writeText(link) : Promise.reject())
      .then(() => toast('Invite link copied'))
      .catch(() => window.prompt('Copy this invite link:', link));
  };
}
function genCode() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let c = TRACK_LETTERS[TRACK_ID]; for (let i = 0; i < 4; i++) c += chars[Math.floor(Math.random() * chars.length)];
  return c;
}

function startHost() {
  if (typeof Peer === 'undefined') return setStatus('Multiplayer library failed to load. Check your connection.');
  setStatus('Creating room...');
  const code = genCode();
  const peer = new Peer('lpr-' + code);
  net.peer = peer; net.host = true;
  peer.on('open', id => {
    net.id = id; showRoom(code); startGame(); $('startBtn').style.display = 'block';
    setInterval(() => {
      const snap = {}; snap[net.id] = mine(); Object.assign(snap, net.states);
      for (const c of Object.values(net.conns)) if (c.open) c.send({ t: 'w', p: snap });
    }, 50);
  });
  peer.on('error', e => {
    if (e.type === 'unavailable-id') { peer.destroy(); startHost(); }
    else { setStatus('Network error: ' + e.type); toast('Network error: ' + e.type); }
  });
  peer.on('connection', conn => {
    conn.on('open', () => { net.conns[conn.peer] = conn; toast('A player joined'); });
    conn.on('data', d => { if (d && d.t === 's') net.states[conn.peer] = d.s; });
    conn.on('close', () => { delete net.conns[conn.peer]; delete net.states[conn.peer]; toast('A player left'); });
  });
}

function joinRoom(raw) {
  const code = raw.trim().toUpperCase();
  if (code.length !== 5) return setStatus('Enter the 5-character room code.');
  if (typeof Peer === 'undefined') return setStatus('Multiplayer library failed to load. Check your connection.');
  const tr = TRACK_LETTERS.indexOf(code[0]);
  if (tr >= 0 && tr !== TRACK_ID) { location.search = '?track=' + tr + '&room=' + code + '&join=1'; return; }   // load the host's track first
  setStatus('Connecting...');
  const peer = new Peer();
  net.peer = peer; net.host = false;
  const timer = setTimeout(() => { setStatus('Could not connect. Check the code and try again.'); peer.destroy(); }, 12000);
  peer.on('open', id => {
    net.id = id;
    const conn = peer.connect('lpr-' + code);
    net.hostConn = conn;
    conn.on('open', () => {
      clearTimeout(timer); showRoom(code); startGame();
      setInterval(() => { if (conn.open) conn.send({ t: 's', s: mine() }); }, 50);
    });
    conn.on('data', d => {
      if (!d) return;
      if (d.t === 'w') net.snapshot = d.p;
      else if (d.t === 'go' && Array.isArray(d.ids)) startRace(d.ids);
    });
    conn.on('close', () => { net.snapshot = {}; toast('Disconnected from the host', 6000); });
  });
  peer.on('error', e => {
    clearTimeout(timer);
    const msg = e.type === 'peer-unavailable' ? 'Room not found. Check the code.' : 'Network error: ' + e.type;
    setStatus(msg); toast(msg);
  });
}

function syncRemotes(dt) {
  const src = net.host ? net.states : net.snapshot;
  const k = 1 - Math.exp(-12 * dt);
  const seen = {};
  for (const id in src) {
    if (id === net.id) continue;
    const s = src[id]; seen[id] = true;
    let r = remotes[id];
    if (!r) {
      r = remotes[id] = { mesh: makeCar(s.h), hue: s.h };
      r.mesh.position.set(s.x, s.y || 0, s.z); r.mesh.rotation.y = s.r;
      scene.add(r.mesh);
    }
    const nm = String(s.n || 'Player').slice(0, 12);
    if (r.name !== nm) {
      if (r.label) r.mesh.remove(r.label);
      r.label = makeLabel(nm); r.name = nm; r.mesh.add(r.label);
    }
    r.mesh.position.x += (s.x - r.mesh.position.x) * k;
    r.mesh.position.z += (s.z - r.mesh.position.z) * k;
    r.mesh.position.y += ((s.y || 0) - r.mesh.position.y) * k;
    let d = s.r - r.mesh.rotation.y; d = Math.atan2(Math.sin(d), Math.cos(d));
    r.mesh.rotation.y += d * k;
    animateCar(r.mesh, dt, 0, s.v || 0, false, false);
  }
  for (const id in remotes) if (!seen[id]) { scene.remove(remotes[id].mesh); delete remotes[id]; }
  const n = Object.keys(remotes).length + 1;
  $('players').textContent = net.peer ? n + (n === 1 ? ' player' : ' players') : 'Solo';
}

/* ---------- race mode ---------- */
const LAPS = 3;
const race = { state: 'free', t0: 0, goT: 0, finish: null };   // free (practice) | countdown | racing | finished
let lastBeep = 0, hudTick = 0;

function makeLabel(text) {
  const c = document.createElement('canvas'); c.width = 256; c.height = 64;
  const g = c.getContext('2d');
  g.font = 'bold 34px system-ui, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.lineWidth = 6; g.strokeStyle = 'rgba(0,0,0,.65)'; g.strokeText(text, 128, 32);
  g.fillStyle = '#fff'; g.fillText(text, 128, 32);
  const spr = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), transparent: true }));
  spr.scale.set(8, 2, 1); spr.position.y = 3.4;
  return spr;
}
function bigText(t, ms) {
  const b = $('big'); b.textContent = t;
  if (ms) setTimeout(() => { if (b.textContent === t) b.textContent = ''; }, ms);
}
// two columns of grid slots behind the start line; everyone computes the same slot from the sorted id list
function gridSlot(slot) {
  const row = Math.floor(slot / 2), col = slot % 2;
  const i = ((N - 12 - row * 9) % N + N) % N;
  const p = center[i], t = tang[i], off = col ? 3.5 : -3.5;
  return { x: p.x + (-t.z) * off, y: p.y, z: p.z + t.x * off, th: Math.atan2(t.x, t.z), i };
}
function startRace(ids) {
  const g = gridSlot(Math.max(0, ids.indexOf(net.id)));
  me.x = g.x; me.y = g.y; me.z = g.z; me.th = g.th;
  me.vx = 0; me.vz = 0; me.speed = 0; me.spd = 0; me.steer = 0; me.slip = 0;
  lapsDone = 0; half = false; lastIdx = g.i; lastLap = null; bestLap = null;
  race.state = 'countdown'; race.t0 = performance.now(); race.finish = null;
  lastBeep = 0;
  $('results').style.display = 'none';
  $('startBtn').style.display = 'none';
  started = true; menu.style.display = 'none';
}
function raceTick() {
  if (race.state !== 'countdown') return;
  const left = 3 - (performance.now() - race.t0) / 1000;
  if (left > 0) {
    const n = Math.ceil(left);
    if (n !== lastBeep) { lastBeep = n; beep(440); bigText(String(n)); }
  } else {
    race.state = 'racing'; race.goT = performance.now(); lapStart = race.goT;
    beep(880, 0.45); bigText('GO!', 900);
  }
}
function finishRace(now) {
  race.state = 'finished';
  race.finish = (now - race.goT) / 1000;
  beep(660, 0.4);
  showResults();
}
function players() {
  const src = net.peer ? (net.host ? net.states : net.snapshot) : {};
  const list = [{ id: net.id || 'me', n: me.name, p: me.prog, f: race.finish, me: true }];
  for (const id in src) {
    if (id === net.id) continue;
    const x = src[id];
    list.push({ id, n: String(x.n || 'Player').slice(0, 12), p: x.p || 0, f: x.f == null ? null : x.f });
  }
  list.sort((a, b) => (a.f != null && b.f != null) ? a.f - b.f : a.f != null ? -1 : b.f != null ? 1 : b.p - a.p);
  return list;
}
function showResults() {
  const L = players(), mineIdx = L.findIndex(x => x.me) + 1;
  const ord = ['', '1st', '2nd', '3rd'][mineIdx] || (mineIdx + 'th');
  $('resTitle').textContent = race.finish != null ? 'Finished ' + ord + '!' : 'Results';
  const box = $('resList'); box.textContent = '';
  L.forEach((x, i) => {
    const row = document.createElement('div'); row.className = 'rr' + (x.me ? ' me' : '');
    const a = document.createElement('span'); a.textContent = (i + 1) + '. ' + x.n;
    const b = document.createElement('span'); b.textContent = x.f != null ? x.f.toFixed(2) + 's' : 'racing...';
    row.appendChild(a); row.appendChild(b); box.appendChild(row);
  });
  $('again').style.display = (!net.peer || net.host) ? 'inline-block' : 'none';
  $('results').style.display = 'block';
}
function updatePos() {
  const L = players(), i = L.findIndex(x => x.me);
  $('posInfo').textContent = L.length > 1 ? 'Position ' + (i + 1) + '/' + L.length : '';
}
function hostStart() {
  const ids = [net.id].concat(Object.keys(net.conns).filter(id => net.conns[id].open)).sort();
  for (const c of Object.values(net.conns)) if (c.open) c.send({ t: 'go', ids });
  startRace(ids);
}
$('menuBtn').onclick = () => toMenu();
$('startBtn').onclick = () => hostStart();
$('again').onclick = () => { if (net.peer && net.host) hostStart(); else startRace([]); };

/* ---------- menu wiring ---------- */
$('name').value = me.name;
$('name').oninput = e => { me.name = (e.target.value || 'Player').slice(0, 12); savePrefs(); };
const swEls = [];
function setHue(h) {
  me.hue = h; savePrefs();
  scene.remove(myCar);
  myCar = makeCar(h);
  myCar.position.set(me.x, me.y, me.z); myCar.rotation.y = me.th;
  scene.add(myCar);
  swEls.forEach((b, i) => b.className = 'sw' + (HUES[i] === h ? ' on' : ''));
}
HUES.forEach(h => {
  const b = document.createElement('button');
  b.style.background = '#' + new THREE.Color().setHSL(h, 0.85, 0.5).getHexString();
  b.onclick = () => setHue(h);
  $('swatches').appendChild(b); swEls.push(b);
});
swEls.forEach((b, i) => b.className = 'sw' + (HUES[i] === me.hue ? ' on' : ''));
TRACKS.forEach((t, i) => {
  const b = document.createElement('button');
  b.textContent = t.name; b.className = 'tr' + (i === TRACK_ID ? ' on' : '');
  b.onclick = () => { if (i !== TRACK_ID) location.search = '?track=' + i; };   // reload with that track
  $('tracks').appendChild(b);
});
$('solo').onclick = () => { initAudio(); startGame(); startRace([]); };
$('host').onclick = () => { initAudio(); startHost(); };
$('join').onclick = () => { initAudio(); joinRoom($('code').value); };
$('code').addEventListener('keydown', e => { if (e.key === 'Enter') joinRoom($('code').value); });
const roomParam = new URLSearchParams(location.search).get('room');
if (roomParam) $('code').value = roomParam.toUpperCase().slice(0, 5);
if (new URLSearchParams(location.search).get('join') === '1' && $('code').value.length === 5) joinRoom($('code').value);

/* ---------- minimap ---------- */
const mini = $('mini'), mctx = mini.getContext('2d');
const mmap = (() => {
  let minX = 1e9, maxX = -1e9, minZ = 1e9, maxZ = -1e9;
  for (const p of center) {
    minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x);
    minZ = Math.min(minZ, p.z); maxZ = Math.max(maxZ, p.z);
  }
  const pad = 16, S = mini.width - pad * 2, sc = S / Math.max(maxX - minX, maxZ - minZ);
  const ox = pad + (S - (maxX - minX) * sc) / 2, oz = pad + (S - (maxZ - minZ) * sc) / 2;
  const toXY = (x, z) => [ox + (x - minX) * sc, oz + (z - minZ) * sc];
  const layer = document.createElement('canvas');
  layer.width = mini.width; layer.height = mini.height;
  const c = layer.getContext('2d');
  c.lineJoin = 'round'; c.lineCap = 'round';
  c.beginPath();
  center.forEach((p, i) => { const [x, y] = toXY(p.x, p.z); i ? c.lineTo(x, y) : c.moveTo(x, y); });
  c.closePath();
  c.strokeStyle = 'rgba(255,255,255,.95)'; c.lineWidth = 7; c.stroke();
  c.strokeStyle = '#3a3a42'; c.lineWidth = 4; c.stroke();
  const [sx, sy] = toXY(center[0].x, center[0].z);   // start line tick
  c.strokeStyle = '#ffd37a'; c.lineWidth = 3;
  c.beginPath(); c.moveTo(sx, sy - 6); c.lineTo(sx, sy + 6); c.stroke();
  return { toXY, layer };
})();
function drawMini() {
  mctx.clearRect(0, 0, mini.width, mini.height);
  mctx.drawImage(mmap.layer, 0, 0);
  const dot = (x, z, r, hue, ring) => {
    const [px, py] = mmap.toXY(x, z);
    mctx.beginPath(); mctx.arc(px, py, r, 0, Math.PI * 2);
    mctx.fillStyle = 'hsl(' + Math.round(hue * 360) + ',75%,50%)'; mctx.fill();
    if (ring) { mctx.strokeStyle = '#fff'; mctx.lineWidth = 2; mctx.stroke(); }
  };
  for (const id in remotes) dot(remotes[id].mesh.position.x, remotes[id].mesh.position.z, 4, remotes[id].hue, false);
  dot(me.x, me.z, 5, me.hue, true);
}

/* ---------- speed lines ---------- */
const fxc = document.getElementById('fx'), fxg = fxc.getContext('2d');
const streaks = Array.from({ length: 48 }, () => ({ a: Math.random() * Math.PI * 2, p: Math.random() }));
function drawFx(sf, dt) {
  if (fxc.width !== window.innerWidth || fxc.height !== window.innerHeight) {
    fxc.width = window.innerWidth; fxc.height = window.innerHeight;
  }
  const w = fxc.width, h = fxc.height;
  fxg.clearRect(0, 0, w, h);
  const k = Math.max(0, (sf - 0.45) / 0.55);
  if (k <= 0) return;
  const cx = w / 2, cy = h * 0.46, R = Math.hypot(w, h) / 2;
  fxg.lineCap = 'round';
  for (const st of streaks) {
    st.p += dt * (0.8 + 1.8 * k);
    if (st.p > 1) { st.p = 0; st.a = Math.random() * Math.PI * 2; }
    const r0 = R * (0.3 + 0.7 * st.p * st.p);
    const len = R * (0.05 + 0.2 * k) * (0.3 + st.p);
    fxg.strokeStyle = 'rgba(255,255,255,' + (0.38 * k * st.p).toFixed(3) + ')';
    fxg.lineWidth = 1 + 2 * st.p;
    fxg.beginPath();
    fxg.moveTo(cx + Math.cos(st.a) * r0, cy + Math.sin(st.a) * r0);
    fxg.lineTo(cx + Math.cos(st.a) * (r0 + len), cy + Math.sin(st.a) * (r0 + len));
    fxg.stroke();
  }
}

/* ---------- main loop ---------- */
const clock = new THREE.Clock();
const camPos = new THREE.Vector3();
let camTh = me.th;
camPos.set(me.x - Math.sin(me.th) * 11, 5, me.z - Math.cos(me.th) * 11);
function loop() {
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), 0.05);
  if (started) update(dt);
  syncRemotes(dt);
  drawMini();

  const sf = Math.min(1, me.spd / VMAX);
  // the camera looks a bit along the direction of travel, so a slide shows up on screen
  let target = me.th;
  if (Math.hypot(me.vx, me.vz) > 10) {
    let dv = Math.atan2(me.vx, me.vz) - me.th;
    dv = Math.atan2(Math.sin(dv), Math.cos(dv));
    target = me.th + Math.max(-0.7, Math.min(0.7, dv)) * 0.5;
  }
  let dc = target - camTh; dc = Math.atan2(Math.sin(dc), Math.cos(dc));
  camTh += dc * (1 - Math.exp(-7 * dt));

  const fx = Math.sin(camTh), fz = Math.cos(camTh);
  const dist = 10.5 + 4.5 * sf, height = 4.6 + 1.2 * sf;
  const want = new THREE.Vector3(me.x - fx * dist, me.y + height, me.z - fz * dist);
  camPos.lerp(want, 1 - Math.exp(-8 * dt));
  camera.position.copy(camPos);
  const shake = Math.max(0, sf - 0.75) * 0.25;
  if (shake) camera.position.add(new THREE.Vector3((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake));
  camera.lookAt(me.x + fx * 6, me.y + 1.4, me.z + fz * 6);

  const fov = 66 + 26 * sf * sf;                       // widens with speed, which is most of what makes it feel fast
  if (Math.abs(camera.fov - fov) > 0.05) { camera.fov += (fov - camera.fov) * (1 - Math.exp(-6 * dt)); camera.updateProjectionMatrix(); }
  drawFx(sf, dt);
  if (++hudTick % 12 === 0 && started) { updatePos(); if (race.state === 'finished') showResults(); }
  renderer.render(scene, camera);
}
loop();
</script>
</body>
</html>
