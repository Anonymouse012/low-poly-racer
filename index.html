<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Low Poly Racer</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #9fd3ff; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; color: #fff; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
  .hud { position: fixed; pointer-events: none; text-shadow: 0 2px 6px rgba(0,0,0,.6); font-weight: 700; }
  #hudLeft { top: 14px; left: 16px; font-size: 18px; line-height: 1.5; }
  #hudLeft .big { font-size: 40px; }
  #hudRight { top: 14px; right: 16px; text-align: right; font-size: 15px; line-height: 1.5; pointer-events: auto; }
  #mini { position: fixed; top: 128px; left: 16px; width: 150px; height: 150px; background: rgba(0,0,0,.35); border-radius: 12px; pointer-events: none; }
  #roomBtn { cursor: pointer; background: rgba(0,0,0,.35); padding: 6px 10px; border-radius: 8px; display: none; }
  #toast { bottom: 90px; left: 0; right: 0; text-align: center; font-size: 16px; }
  #menu { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: rgba(20,30,50,.72); text-align: center; padding: 20px; }
  #menu h1 { margin: 0; font-size: clamp(32px, 8vw, 64px); letter-spacing: 3px; }
  #menu p { margin: 0; max-width: 460px; opacity: .85; }
  #menu small { opacity: .7; }
  button, input { font: inherit; border-radius: 10px; border: 0; padding: 12px 20px; }
  button { background: #ff5a3c; color: #fff; font-weight: 700; cursor: pointer; }
  button:hover { background: #ff7a5e; }
  button:disabled { opacity: .5; cursor: default; }
  input { text-transform: uppercase; text-align: center; width: 150px; letter-spacing: 3px; font-weight: 700; }
  .row { display: flex; gap: 8px; }
  #status { min-height: 22px; color: #ffd37a; }
  .touch { position: fixed; bottom: 16px; left: 0; right: 0; justify-content: space-between; padding: 0 16px; display: none; pointer-events: none; }
  .touch .grp { display: flex; gap: 12px; pointer-events: auto; }
  .touch button { width: 78px; height: 78px; font-size: 26px; padding: 0; opacity: .8; user-select: none; -webkit-user-select: none; touch-action: none; }
  @media (pointer: coarse) { .touch { display: flex; } }
</style>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
</head>
<body>
<canvas id="c"></canvas>

<div class="hud" id="hudLeft">
  <div><span class="big" id="speed">0</span> km/h</div>
  <div id="lapInfo">Lap 1</div>
  <div id="timeInfo">Last: -- &nbsp; Best: --</div>
</div>
<canvas id="mini" width="160" height="160"></canvas>
<div class="hud" id="hudRight">
  <div id="players">Solo</div>
  <div id="roomBtn" title="Click to copy invite link"></div>
</div>
<div class="hud" id="toast"></div>

<div class="touch">
  <div class="grp"><button id="tLeft">◀</button><button id="tRight">▶</button></div>
  <div class="grp"><button id="tBrake">■</button><button id="tGas">▲</button></div>
</div>

<div id="menu">
  <h1>LOW POLY RACER</h1>
  <p>Race friends right in your browser. Cars pass through each other, so nobody gets wrecked.</p>
  <button id="solo">Drive solo</button>
  <button id="host">Host a race</button>
  <div class="row">
    <input id="code" maxlength="5" placeholder="CODE" autocomplete="off">
    <button id="join">Join</button>
  </div>
  <div id="status"></div>
  <small>W / ↑ gas &nbsp;·&nbsp; S / ↓ brake &nbsp;·&nbsp; A D / ← → steer &nbsp;·&nbsp; R reset to track</small>
</div>

<script type="module">
import * as THREE from 'three';

/* ---------- renderer / scene ---------- */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9fd3ff);
scene.fog = new THREE.Fog(0x9fd3ff, 220, 1150);
const camera = new THREE.PerspectiveCamera(70, 1, 0.1, 2000);

function resize() {
  renderer.setSize(window.innerWidth, window.innerHeight, false);
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

scene.add(new THREE.HemisphereLight(0xffffff, 0x4a7a3a, 1.4));
const sun = new THREE.DirectionalLight(0xfff2cc, 2.2);
sun.position.set(100, 200, 50);
scene.add(sun);

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(2400, 2400),
  new THREE.MeshStandardMaterial({ color: 0x5a9e4b, flatShading: true })
);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

/* ---------- track ---------- */
const ROAD_W = 10;          // half width of the road
const KERB_W = 1.2;
const WALL_D = ROAD_W + KERB_W + 3.5;   // distance from the centre line to the barriers
// A proper circuit (about 1.5 km): start straight, fast right, chicane, back straight,
// hairpin, left kink, long sweeper and a final corner back onto the straight.
const controlPts = [
  [-60, 0], [60, 0], [170, -2],                                          // start / finish straight
  [225, 12], [262, 50], [272, 100],                                      // fast right-hander
  [284, 145], [268, 185], [270, 230],                                    // chicane
  [262, 265], [235, 288], [190, 297],                                    // right onto the back straight
  [80, 297], [-40, 297],                                                 // back straight
  [-120, 297], [-145, 286], [-156, 261], [-145, 236], [-120, 225],       // hairpin
  [-70, 225], [-30, 212], [-5, 185],                                     // left kink
  [-10, 150], [-45, 125], [-95, 105],                                    // long right-hand sweeper
  [-135, 80], [-145, 45], [-125, 15], [-90, 2]                           // final corner
].map(([x, z]) => new THREE.Vector3(x, 0, z));
const curve = new THREE.CatmullRomCurve3(controlPts, true, 'centripetal');
const N = 800;
const SPAWN_IDX = N - 10;
const center = curve.getSpacedPoints(N).slice(0, N);
const tang = center.map((p, i) =>
  center[(i + 1) % N].clone().sub(center[(i - 1 + N) % N]).setY(0).normalize());

(function buildRoad() {
  const pos = [], col = [];
  const road1 = new THREE.Color(0x3a3a42), road2 = new THREE.Color(0x44444d);
  const red = new THREE.Color(0xd8342c), white = new THREE.Color(0xf2f2f2);

  function tri(a, b, c, color, y) {
    for (const v of [a, b, c]) { pos.push(v[0], y, v[1]); col.push(color.r, color.g, color.b); }
  }
  function quad(a, b, c, d, color, y) { tri(a, b, c, color, y); tri(a, c, d, color, y); }
  function side(i, s, w) {
    const p = center[i % N], t = tang[i % N];
    return [p.x + (-t.z) * s * w, p.z + t.x * s * w];
  }

  for (let i = 0; i < N; i++) {
    const R0 = side(i, 1, ROAD_W), L0 = side(i, -1, ROAD_W);
    const R1 = side(i + 1, 1, ROAD_W), L1 = side(i + 1, -1, ROAD_W);
    quad(R0, R1, L1, L0, Math.floor(i / 3) % 2 ? road1 : road2, 0.05);
    if (Math.floor(i / 4) % 2 === 0) {            // dashed centre line
      quad(side(i, 1, 0.3), side(i + 1, 1, 0.3), side(i + 1, -1, 0.3), side(i, -1, 0.3), white, 0.07);
    }

    const kc = Math.floor(i / 2) % 2 ? red : white;
    for (const s of [1, -1]) {
      const in0 = side(i, s, ROAD_W), out0 = side(i, s, ROAD_W + KERB_W);
      const in1 = side(i + 1, s, ROAD_W), out1 = side(i + 1, s, ROAD_W + KERB_W);
      quad(in0, out0, out1, in1, kc, 0.08);
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  geo.computeVertexNormals();
  scene.add(new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
    vertexColors: true, flatShading: true, side: THREE.DoubleSide
  })));

  // start / finish line
  const cv = document.createElement('canvas'); cv.width = 16; cv.height = 2;
  const cx = cv.getContext('2d');
  for (let x = 0; x < 16; x++) for (let y = 0; y < 2; y++) {
    cx.fillStyle = (x + y) % 2 ? '#111' : '#fff'; cx.fillRect(x, y, 1, 1);
  }
  const tex = new THREE.CanvasTexture(cv);
  tex.magFilter = THREE.NearestFilter; tex.minFilter = THREE.NearestFilter;
  const lineGeo = new THREE.PlaneGeometry(ROAD_W * 2, 3);
  lineGeo.rotateX(-Math.PI / 2);
  const line = new THREE.Mesh(lineGeo, new THREE.MeshBasicMaterial({ map: tex }));
  line.position.set(center[0].x, 0.1, center[0].z);
  line.rotation.y = Math.atan2(tang[0].x, tang[0].z);
  scene.add(line);
})();

/* trees (seeded so every player sees the same ones) */
(function buildTrees() {
  let seed = 1234;
  const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const spots = [];
  for (let k = 0; k < 1500 && spots.length < 260; k++) {
    const x = -420 + rnd() * 940, z = -200 + rnd() * 740;
    if (x > -20 && x < 130 && z > -100 && z < -10) continue;   // keep the grandstand area clear
    let min = 1e9;
    for (let i = 0; i < N; i += 2) {
      const dx = center[i].x - x, dz = center[i].z - z;
      const d = dx * dx + dz * dz; if (d < min) min = d;
    }
    if (Math.sqrt(min) > WALL_D + 10) spots.push([x, z, 0.8 + rnd() * 0.9]);
  }
  const trunks = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.4, 0.55, 2, 5),
    new THREE.MeshStandardMaterial({ color: 0x6b4a2b, flatShading: true }), spots.length);
  const tops = new THREE.InstancedMesh(new THREE.ConeGeometry(2.6, 7, 5),
    new THREE.MeshStandardMaterial({ color: 0x2f7a3a, flatShading: true }), spots.length);
  const m = new THREE.Matrix4();
  spots.forEach(([x, z, s], i) => {
    m.makeScale(s, s, s).setPosition(x, 1 * s, z); trunks.setMatrixAt(i, m);
    m.makeScale(s, s, s).setPosition(x, 5.5 * s, z); tops.setMatrixAt(i, m);
  });
  scene.add(trunks, tops);
})();

/* barriers along both sides of the circuit */
(function buildWalls() {
  const pos = [], col = [];
  const red = new THREE.Color(0xd8342c), white = new THREE.Color(0xf2f2f2);
  const H = 1.4, T = 0.8;
  function at(i, s, w, y) {
    const p = center[i % N], t = tang[i % N];
    return [p.x + (-t.z) * s * w, y, p.z + t.x * s * w];
  }
  function quad(a, b, c, d, color) {
    for (const v of [a, b, c, a, c, d]) { pos.push(v[0], v[1], v[2]); col.push(color.r, color.g, color.b); }
  }
  for (let i = 0; i < N; i++) {
    const c = Math.floor(i / 4) % 2 ? red : white;
    for (const s of [1, -1]) {
      quad(at(i, s, WALL_D, 0), at(i + 1, s, WALL_D, 0), at(i + 1, s, WALL_D, H), at(i, s, WALL_D, H), c);          // face
      quad(at(i, s, WALL_D, H), at(i + 1, s, WALL_D, H), at(i + 1, s, WALL_D + T, H), at(i, s, WALL_D + T, H), c);  // top
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  geo.computeVertexNormals();
  scene.add(new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
    vertexColors: true, flatShading: true, side: THREE.DoubleSide
  })));
})();

/* start gantry and grandstand */
(function buildStart() {
  const mat = c => new THREE.MeshStandardMaterial({ color: c, flatShading: true });

  const gantry = new THREE.Group();
  const w = ROAD_W + 2;
  for (const s of [-1, 1]) {
    const post = new THREE.Mesh(new THREE.BoxGeometry(1, 10, 1), mat(0x30343c));
    post.position.set(s * w, 5, 0); gantry.add(post);
  }
  const beam = new THREE.Mesh(new THREE.BoxGeometry(w * 2 + 1, 1.8, 1.4), mat(0xd8342c));
  beam.position.set(0, 10, 0); gantry.add(beam);
  const stripe = new THREE.Mesh(new THREE.BoxGeometry(w * 2 - 4, 0.6, 1.5), new THREE.MeshBasicMaterial({ color: 0xffffff }));
  stripe.position.set(0, 10, 0); gantry.add(stripe);
  gantry.position.set(center[0].x, 0, center[0].z);
  gantry.rotation.y = Math.atan2(tang[0].x, tang[0].z);
  scene.add(gantry);

  // grandstand on the outside of the start straight
  const si = Math.round(N * 0.07), sp = center[si], st = tang[si];
  const stand = new THREE.Group();
  const LEN = 110;
  for (let k = 0; k < 4; k++) {
    const h = 2.2 * (k + 1);
    const tier = new THREE.Mesh(new THREE.BoxGeometry(3.2, h, LEN), mat(0x8a909a));
    tier.position.set(k * 3.2 + 1.6, h / 2, 0); stand.add(tier);
  }
  const crowd = new THREE.InstancedMesh(new THREE.BoxGeometry(1.1, 1.1, 1.1), mat(0xffffff), 4 * 50);
  const m = new THREE.Matrix4(), c = new THREE.Color();
  let n = 0;
  for (let k = 0; k < 4; k++) for (let j = 0; j < 50; j++) {
    m.makeTranslation(k * 3.2 + 1.6, 2.2 * (k + 1) + 0.55, -LEN / 2 + 1 + j * (LEN - 2) / 49);
    crowd.setMatrixAt(n, m);
    c.setHSL((n * 0.618) % 1, 0.7, 0.55); crowd.setColorAt(n, c); n++;
  }
  stand.add(crowd);
  const roof = new THREE.Mesh(new THREE.BoxGeometry(14, 0.5, LEN + 4), mat(0xd8342c));
  roof.position.set(7, 14.5, 0); stand.add(roof);
  for (const z of [-LEN / 2, 0, LEN / 2]) {
    const post = new THREE.Mesh(new THREE.BoxGeometry(0.6, 14, 0.6), mat(0x30343c));
    post.position.set(13.3, 7, z); stand.add(post);
  }
  stand.position.set(sp.x + st.z * (WALL_D + 8), 0, sp.z - st.x * (WALL_D + 8));
  stand.rotation.y = Math.atan2(st.x, st.z);
  scene.add(stand);
})();

/* distant hills */
(function buildHills() {
  let seed = 99;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const mats = [0x6f8f6a, 0x7d9a8c, 0x8a9aa8].map(c => new THREE.MeshStandardMaterial({ color: c, flatShading: true }));
  for (let k = 0; k < 36; k++) {
    const a = k / 36 * Math.PI * 2 + rnd() * 0.1, r = 720 + rnd() * 120;
    const h = 80 + rnd() * 140, rad = 90 + rnd() * 90;
    const hill = new THREE.Mesh(new THREE.ConeGeometry(rad, h, 5), mats[Math.floor(rnd() * 3)]);
    hill.position.set(60 + Math.cos(a) * r, h / 2 - 2, 150 + Math.sin(a) * r);
    hill.rotation.y = rnd() * 6;
    scene.add(hill);
  }
})();

function nearest(x, z) {
  let best = 1e18, bi = 0;
  for (let i = 0; i < N; i++) {
    const dx = center[i].x - x, dz = center[i].z - z;
    const d = dx * dx + dz * dz;
    if (d < best) { best = d; bi = i; }
  }
  return { i: bi, d: Math.sqrt(best) };
}

/* ---------- cars ---------- */
function makeCar(hue) {
  const g = new THREE.Group();
  const mat = c => new THREE.MeshStandardMaterial({ color: c, flatShading: true });
  const bodyCol = new THREE.Color().setHSL(hue, 0.75, 0.5);
  const body = new THREE.Mesh(new THREE.BoxGeometry(2, 0.6, 4.2), mat(bodyCol));
  body.position.y = 0.75; g.add(body);
  const cab = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.55, 1.9), mat(0x223344));
  cab.position.set(0, 1.3, -0.3); g.add(cab);
  const spoiler = new THREE.Mesh(new THREE.BoxGeometry(2, 0.1, 0.5), mat(bodyCol));
  spoiler.position.set(0, 1.5, -1.9); g.add(spoiler);
  const wgeo = new THREE.CylinderGeometry(0.45, 0.45, 0.4, 8); wgeo.rotateZ(Math.PI / 2);
  for (const [x, z] of [[-1.1, 1.3], [1.1, 1.3], [-1.1, -1.3], [1.1, -1.3]]) {
    const w = new THREE.Mesh(wgeo, mat(0x151515)); w.position.set(x, 0.45, z); g.add(w);
  }
  for (const x of [-0.6, 0.6]) {
    const l = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.22, 0.06),
      new THREE.MeshStandardMaterial({ color: 0xffee99, emissive: 0xffee99, flatShading: true }));
    l.position.set(x, 0.8, 2.12); g.add(l);
  }
  return g;
}

const me = { x: 0, z: 0, th: 0, speed: 0, hue: Math.random() };
const myCar = makeCar(me.hue);
scene.add(myCar);

function spawn() {
  const i = SPAWN_IDX;
  const p = center[i], t = tang[i];
  const off = (Math.random() - 0.5) * 12;
  me.x = p.x + (-t.z) * off; me.z = p.z + t.x * off;
  me.th = Math.atan2(t.x, t.z); me.speed = 0;
}
function resetCar() {
  const n = nearest(me.x, me.z), t = tang[n.i];
  me.x = center[n.i].x; me.z = center[n.i].z;
  me.th = Math.atan2(t.x, t.z); me.speed = 0;
}
spawn();

/* ---------- input ---------- */
const keys = {}, touch = {};
window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  keys[e.code] = true;
  if (e.code === 'KeyR') resetCar();
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });
for (const [id, name] of [['tLeft', 'left'], ['tRight', 'right'], ['tGas', 'gas'], ['tBrake', 'brake']]) {
  const el = document.getElementById(id);
  const on = e => { e.preventDefault(); touch[name] = true; };
  const off = e => { e.preventDefault(); touch[name] = false; };
  el.addEventListener('pointerdown', on);
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => el.addEventListener(ev, off));
}

/* ---------- driving + laps ---------- */
let lapsDone = 0, half = false, lastIdx = SPAWN_IDX, lapStart = performance.now();
let touchingWall = false;
let lastLap = null, bestLap = null;
let started = false;
const fmt = t => t == null ? '--' : t.toFixed(2) + 's';

function update(dt) {
  const up = keys.ArrowUp || keys.KeyW || touch.gas;
  const down = keys.ArrowDown || keys.KeyS || touch.brake;
  const left = keys.ArrowLeft || keys.KeyA || touch.left;
  const right = keys.ArrowRight || keys.KeyD || touch.right;

  const near = nearest(me.x, me.z);
  const off = near.d > ROAD_W + KERB_W;
  const maxF = off ? 20 : 60;

  if (up) me.speed += 30 * dt;
  else if (down) me.speed -= (me.speed > 0 ? 60 : 20) * dt;
  else me.speed -= Math.sign(me.speed) * Math.min(Math.abs(me.speed), 8 * dt);
  me.speed = Math.max(me.speed, -15);
  if (me.speed > maxF) me.speed = off ? me.speed - (me.speed - maxF) * Math.min(1, 3 * dt) : maxF;

  const steer = (left ? 1 : 0) - (right ? 1 : 0);
  const grip = Math.min(1, Math.abs(me.speed) / 8);
  me.th += steer * 2.0 * grip * Math.sign(me.speed) / (1 + Math.abs(me.speed) / 50) * dt;
  me.x += Math.sin(me.th) * me.speed * dt;
  me.z += Math.cos(me.th) * me.speed * dt;

  // barriers: keep the car on the circuit and scrub off speed when it hits one
  const hit = nearest(me.x, me.z), lim = WALL_D - 1.3;
  if (hit.d > lim) {
    const c = center[hit.i], dx = me.x - c.x, dz = me.z - c.z, d = Math.hypot(dx, dz) || 1;
    me.x = c.x + dx / d * lim; me.z = c.z + dz / d * lim;
    if (!touchingWall) me.speed *= 0.6;
    me.speed *= Math.max(0, 1 - 2.5 * dt);
    touchingWall = true;
  } else touchingWall = false;

  // lap counting
  const idx = near.i;
  if (idx >= N * 0.4 && idx <= N * 0.6) half = true;
  if (lastIdx > N * 0.8 && idx < N * 0.2) {
    if (half) {
      const now = performance.now();
      lastLap = (now - lapStart) / 1000;
      bestLap = bestLap == null ? lastLap : Math.min(bestLap, lastLap);
      lapStart = now; lapsDone++;
    }
    half = false;
  }
  lastIdx = idx;

  myCar.position.set(me.x, 0, me.z);
  myCar.rotation.y = me.th;

  document.getElementById('speed').textContent = Math.round(Math.abs(me.speed) * 2);
  document.getElementById('lapInfo').textContent = 'Lap ' + (lapsDone + 1);
  document.getElementById('timeInfo').innerHTML = 'Last: ' + fmt(lastLap) + ' &nbsp; Best: ' + fmt(bestLap);
}

/* ---------- multiplayer (PeerJS, peer-to-peer, star topology around the host) ---------- */
const net = { peer: null, host: false, id: null, conns: {}, states: {}, snapshot: {}, hostConn: null, code: null };
const remotes = {};
const $ = id => document.getElementById(id);
const menu = $('menu'), statusEl = $('status');
const setStatus = msg => { statusEl.textContent = msg; };
function toast(msg, ms = 3000) { $('toast').textContent = msg; setTimeout(() => { if ($('toast').textContent === msg) $('toast').textContent = ''; }, ms); }

function mine() {
  return { x: +me.x.toFixed(2), z: +me.z.toFixed(2), r: +me.th.toFixed(3), v: +me.speed.toFixed(1), h: me.hue };
}
function startGame() {
  started = true; menu.style.display = 'none';
  lapStart = performance.now();
}
function showRoom(code) {
  net.code = code;
  const link = location.origin + location.pathname + '?room=' + code;
  const b = $('roomBtn');
  b.style.display = 'block';
  b.textContent = 'Room ' + code + ' (tap to copy link)';
  b.onclick = () => {
    (navigator.clipboard ? navigator.clipboard.writeText(link) : Promise.reject())
      .then(() => toast('Invite link copied'))
      .catch(() => window.prompt('Copy this invite link:', link));
  };
}
function genCode() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let c = ''; for (let i = 0; i < 5; i++) c += chars[Math.floor(Math.random() * chars.length)];
  return c;
}

function startHost() {
  if (typeof Peer === 'undefined') return setStatus('Multiplayer library failed to load. Check your connection.');
  setStatus('Creating room...');
  const code = genCode();
  const peer = new Peer('lpr-' + code);
  net.peer = peer; net.host = true;
  peer.on('open', id => {
    net.id = id; showRoom(code); startGame();
    setInterval(() => {
      const snap = {}; snap[net.id] = mine(); Object.assign(snap, net.states);
      for (const c of Object.values(net.conns)) if (c.open) c.send({ t: 'w', p: snap });
    }, 50);
  });
  peer.on('error', e => {
    if (e.type === 'unavailable-id') { peer.destroy(); startHost(); }
    else { setStatus('Network error: ' + e.type); toast('Network error: ' + e.type); }
  });
  peer.on('connection', conn => {
    conn.on('open', () => { net.conns[conn.peer] = conn; toast('A player joined'); });
    conn.on('data', d => { if (d && d.t === 's') net.states[conn.peer] = d.s; });
    conn.on('close', () => { delete net.conns[conn.peer]; delete net.states[conn.peer]; toast('A player left'); });
  });
}

function joinRoom(raw) {
  const code = raw.trim().toUpperCase();
  if (code.length !== 5) return setStatus('Enter the 5-character room code.');
  if (typeof Peer === 'undefined') return setStatus('Multiplayer library failed to load. Check your connection.');
  setStatus('Connecting...');
  const peer = new Peer();
  net.peer = peer; net.host = false;
  const timer = setTimeout(() => { setStatus('Could not connect. Check the code and try again.'); peer.destroy(); }, 12000);
  peer.on('open', id => {
    net.id = id;
    const conn = peer.connect('lpr-' + code);
    net.hostConn = conn;
    conn.on('open', () => {
      clearTimeout(timer); showRoom(code); startGame();
      setInterval(() => { if (conn.open) conn.send({ t: 's', s: mine() }); }, 50);
    });
    conn.on('data', d => { if (d && d.t === 'w') net.snapshot = d.p; });
    conn.on('close', () => { net.snapshot = {}; toast('Disconnected from the host', 6000); });
  });
  peer.on('error', e => {
    clearTimeout(timer);
    const msg = e.type === 'peer-unavailable' ? 'Room not found. Check the code.' : 'Network error: ' + e.type;
    setStatus(msg); toast(msg);
  });
}

function syncRemotes(dt) {
  const src = net.host ? net.states : net.snapshot;
  const k = 1 - Math.exp(-12 * dt);
  const seen = {};
  for (const id in src) {
    if (id === net.id) continue;
    const s = src[id]; seen[id] = true;
    let r = remotes[id];
    if (!r) {
      r = remotes[id] = { mesh: makeCar(s.h), hue: s.h };
      r.mesh.position.set(s.x, 0, s.z); r.mesh.rotation.y = s.r;
      scene.add(r.mesh);
    }
    r.mesh.position.x += (s.x - r.mesh.position.x) * k;
    r.mesh.position.z += (s.z - r.mesh.position.z) * k;
    let d = s.r - r.mesh.rotation.y; d = Math.atan2(Math.sin(d), Math.cos(d));
    r.mesh.rotation.y += d * k;
  }
  for (const id in remotes) if (!seen[id]) { scene.remove(remotes[id].mesh); delete remotes[id]; }
  const n = Object.keys(remotes).length + 1;
  $('players').textContent = net.peer ? n + (n === 1 ? ' player' : ' players') : 'Solo';
}

/* ---------- menu wiring ---------- */
$('solo').onclick = () => startGame();
$('host').onclick = () => startHost();
$('join').onclick = () => joinRoom($('code').value);
$('code').addEventListener('keydown', e => { if (e.key === 'Enter') joinRoom($('code').value); });
const roomParam = new URLSearchParams(location.search).get('room');
if (roomParam) $('code').value = roomParam.toUpperCase().slice(0, 5);

/* ---------- minimap ---------- */
const mini = $('mini'), mctx = mini.getContext('2d');
const mmap = (() => {
  let minX = 1e9, maxX = -1e9, minZ = 1e9, maxZ = -1e9;
  for (const p of center) {
    minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x);
    minZ = Math.min(minZ, p.z); maxZ = Math.max(maxZ, p.z);
  }
  const pad = 16, S = mini.width - pad * 2, sc = S / Math.max(maxX - minX, maxZ - minZ);
  const ox = pad + (S - (maxX - minX) * sc) / 2, oz = pad + (S - (maxZ - minZ) * sc) / 2;
  const toXY = (x, z) => [ox + (x - minX) * sc, oz + (z - minZ) * sc];
  const layer = document.createElement('canvas');
  layer.width = mini.width; layer.height = mini.height;
  const c = layer.getContext('2d');
  c.lineJoin = 'round'; c.lineCap = 'round';
  c.beginPath();
  center.forEach((p, i) => { const [x, y] = toXY(p.x, p.z); i ? c.lineTo(x, y) : c.moveTo(x, y); });
  c.closePath();
  c.strokeStyle = 'rgba(255,255,255,.95)'; c.lineWidth = 7; c.stroke();
  c.strokeStyle = '#3a3a42'; c.lineWidth = 4; c.stroke();
  const [sx, sy] = toXY(center[0].x, center[0].z);   // start line tick
  c.strokeStyle = '#ffd37a'; c.lineWidth = 3;
  c.beginPath(); c.moveTo(sx, sy - 6); c.lineTo(sx, sy + 6); c.stroke();
  return { toXY, layer };
})();
function drawMini() {
  mctx.clearRect(0, 0, mini.width, mini.height);
  mctx.drawImage(mmap.layer, 0, 0);
  const dot = (x, z, r, hue, ring) => {
    const [px, py] = mmap.toXY(x, z);
    mctx.beginPath(); mctx.arc(px, py, r, 0, Math.PI * 2);
    mctx.fillStyle = 'hsl(' + Math.round(hue * 360) + ',75%,50%)'; mctx.fill();
    if (ring) { mctx.strokeStyle = '#fff'; mctx.lineWidth = 2; mctx.stroke(); }
  };
  for (const id in remotes) dot(remotes[id].mesh.position.x, remotes[id].mesh.position.z, 4, remotes[id].hue, false);
  dot(me.x, me.z, 5, me.hue, true);
}

/* ---------- main loop ---------- */
const clock = new THREE.Clock();
const camPos = new THREE.Vector3();
camPos.set(me.x - Math.sin(me.th) * 12, 6, me.z - Math.cos(me.th) * 12);
function loop() {
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), 0.05);
  if (started) update(dt);
  syncRemotes(dt);
  drawMini();

  const fx = Math.sin(me.th), fz = Math.cos(me.th);
  const want = new THREE.Vector3(me.x - fx * 12, 6, me.z - fz * 12);
  camPos.lerp(want, 1 - Math.exp(-6 * dt));
  camera.position.copy(camPos);
  camera.lookAt(me.x + fx * 6, 1.5, me.z + fz * 6);
  renderer.render(scene, camera);
}
loop();
</script>
</body>
